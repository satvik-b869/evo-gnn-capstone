<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Module C — Geographic Coordinates</title>

<!-- Plotly.js -->
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>
  body {
    margin: 0;
    padding: 40px;
    background: #0f0f0f;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 950px;
    background: #1a1a1a;
    border-radius: 20px;
    padding: 40px;
    border: 1px solid #2a2a2a;
    box-shadow: 0 0 30px rgba(0,0,0,0.35);
  }

  h1 {
    color: #a8e8ff;
    font-size: 30px;
    text-align: center;
    margin-bottom: 20px;
  }

  p {
    color: #cfcfcf;
    font-size: 15px;
    line-height: 1.6;
    text-align: center;
  }

  h2 {
    color: #a8e8ff;
    text-align: center;
    margin-top: 40px;
  }

  #plot2d, #plot3d {
    margin-top: 30px;
    width: 100%;
    height: 600px;
  }

  .btn-row {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
  }

  button {
    padding: 12px 24px;
    border: none;
    border-radius: 14px;
    background: #88d4a7;
    color: black;
    font-size: 16px;
    cursor: pointer;
    font-weight: 600;
  }

  button:hover {
    background: #9ce8ba;
    transform: translateY(-2px);
  }
</style>
</head>

<body>

<div class="container">

  <h1>Module C — Graph Coordinates 🌍</h1>
  <p>
    These coordinates represent each residue's position in graph space,<br>
    derived from the top eigenvectors of the DI-based Laplacian.
  </p>

  <!-- 2D Plot -->
  <h2>2D Spectral Map</h2>
  <div id="plot2d"></div>

  <!-- 3D Plot -->
  <h2>3D Spectral Map 🌐</h2>
  <div id="plot3d"></div>

  <div class="btn-row">
    <button onclick="window.location.href='moduleb'">← Back to Module B</button>
    <button onclick="window.location.href='/moduled'">Next → Module D</button>
  </div>

</div>

<script>
async function loadCoordinates() {
    try {
        const response = await fetch("/compute_modulec");
        const data = await response.json();

        if (data.error) {
            alert("Error: " + data.error);
            return;
        }

        // ============= 2D COORDINATES =============
        const coords2d = data.coords_2d;
        const x2 = coords2d.map(p => p[0]);
        const y2 = coords2d.map(p => p[1]);

        Plotly.newPlot("plot2d", [{
            x: x2,
            y: y2,
            mode: "markers+text",
            text: x2.map((_, i) => "R" + i),
            textposition: "top center",
            marker: {
                size: 8,
                color: "#7dd3fc"
            }
        }], {
            paper_bgcolor: "#1a1a1a",
            plot_bgcolor: "#1a1a1a",
            font: { color: "white" },
            xaxis: { title: "Eigenvector 1" },
            yaxis: { title: "Eigenvector 2" },
            margin: { t: 40 }
        });

        // ============= 3D COORDINATES =============
        const coords3d = data.coords_3d;
        if (coords3d) {
            const x3 = coords3d.map(p => p[0]);
            const y3 = coords3d.map(p => p[1]);
            const z3 = coords3d.map(p => p[2]);

            Plotly.newPlot("plot3d", [{
                x: x3,
                y: y3,
                z: z3,
                mode: "markers+text",
                type: "scatter3d",
                text: x3.map((_, i) => "R" + i),
                marker: {
                    size: 4,
                    color: z3,
                    colorscale: "Viridis",
                }
            }], {
                paper_bgcolor: "#1a1a1a",
                scene: {
                    xaxis: { title: "EV1", color: "white" },
                    yaxis: { title: "EV2", color: "white" },
                    zaxis: { title: "EV3", color: "white" }
                },
                margin: { t: 40 }
            });
        }

    } catch (err) {
        console.error(err);
        alert("Failed to load Module C coordinates.");
    }
}

loadCoordinates();
</script>

</body>
</html>
