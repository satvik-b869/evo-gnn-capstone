<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Protein MSA Generator</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: #0f0f0f;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding-top: 40px;
  }

  .container {
    background: #1a1a1a;
    border-radius: 20px;
    padding: 40px;
    width: 700px;
    box-shadow: 0 0 30px rgba(0,0,0,0.4);
    border: 1px solid #2a2a2a;
    position: relative;
  }

  h1 {
    font-weight: 600;
    font-size: 26px;
    margin-bottom: 25px;
    color: #d3f8d3;
    text-align: center;
  }

  label { font-size: 14px; color: #cfcfcf; }

  textarea {
    width: 100%;
    height: 140px;
    margin-top: 8px;
    margin-bottom: 25px;
    background: #111;
    color: #e8ffe8;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 12px;
    font-size: 14px;
    line-height: 1.4;
  }

  button {
    background: #88d4a7;
    color: #0d0d0d;
    padding: 12px 20px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    cursor: pointer;
    font-weight: 560;
    transition: 0.15s ease;
    width: 100%;
  }

  button:hover {
    background: #9ce8ba;
    transform: translateY(-1px);
  }

  /* Next button */
  #nextBtn {
    display: none;
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: #4caf50;
    color: #000;
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 0 12px rgba(0,255,0,0.2);
    transition: 0.2s;
  }

  #nextBtn:hover {
    background: #69dd78;
    transform: translateY(-2px);
  }

  h2 {
    margin-top: 35px;
    margin-bottom: 10px;
    font-size: 20px;
    color: #d3f8d3;
    text-align: center;
  }

  pre {
    background: #111;
    padding: 20px;
    border-radius: 14px;
    white-space: pre-wrap;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    line-height: 1.45;
    color: #d6ffd8;
    border: 1px solid #222;
    max-height: 500px;
    overflow-y: auto;
  }

</style>
</head>

<body>

<div class="container">

  <h1>Protein MSA Generator</h1>

  <form id="msaForm">
    <label>Paste protein sequence:</label>
    <textarea id="seqInput" name="sequence"></textarea>
    <button type="submit">Generate MSA</button>
  </form>

  <h2>Aligned Sequences</h2>
  <pre id="msaOutput">(nothing yet)</pre>

  <!-- The Next button (hidden until MSA loads) -->
  <button id="nextBtn" onclick="window.location.href='/step1'">Next →</button>

</div>

<script>
document.getElementById("msaForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const seq = document.getElementById("seqInput").value.trim();
  const out = document.getElementById("msaOutput");
  const nextBtn = document.getElementById("nextBtn");

  out.textContent = "Generating MSA… please wait";
  nextBtn.style.display = "none";

  const formData = new FormData();
  formData.append("sequence", seq);

  let resp = await fetch("/generate_msa", {
    method: "POST",
    body: formData
  });

  let data = await resp.json();

  if (data.error) {
    out.textContent = "ERROR: " + data.error;
  } else {
    out.textContent = data.msa_muscle;

    // now show the Next button
    nextBtn.style.display = "block";
  }
});
</script>

</body>
</html>
